<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Flash & AQW Player</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #0b0f19; color: #fff; font-family: sans-serif; overflow: hidden; position: fixed; }
        #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        #toolbar { display: flex; align-items: center; justify-content: space-between; background: #151b2b; padding: 8px 12px; height: 50px; border-bottom: 1px solid #2a344d; }
        .url-box { display: flex; flex: 1; background: #0b0f19; border: 1px solid #3b4c70; border-radius: 6px; margin-right: 8px; }
        .url-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 6px 10px; font-size: 13px; outline: none; }
        .btn { background: #2563eb; color: white; border: none; padding: 6px 14px; font-weight: 600; border-radius: 4px; font-size: 13px; cursor: pointer; }
        #player-container { flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        #ruffle-stage { width: 100%; height: 100%; }
        #touch-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 140px; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 15px; z-index: 100; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }
        .dpad { position: relative; width: 110px; height: 110px; pointer-events: auto; }
        .dpad-btn { position: absolute; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; border-radius: 8px; }
        .dpad-up { top: 0; left: 35px; width: 40px; height: 35px; }
        .dpad-down { bottom: 0; left: 35px; width: 40px; height: 35px; }
        .dpad-left { top: 35px; left: 0; width: 35px; height: 40px; }
        .dpad-right { top: 35px; right: 0; width: 35px; height: 40px; }
        .action-pad { display: grid; grid-template-columns: repeat(3, 45px); gap: 8px; pointer-events: auto; }
        .action-btn { background: rgba(37,99,235,0.4); border: 1px solid rgba(59,130,246,0.6); color: white; height: 45px; border-radius: 50%; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="toolbar">
            <div class="url-box">
                <input type="text" id="swf-input" value="https://game.aq.com/game/loader.swf">
            </div>
            <button class="btn" onclick="loadFlash()">Load</button>
        </div>
        <div id="player-container">
            <div id="ruffle-stage"></div>
            <div id="touch-controls">
                <div class="dpad">
                    <div class="dpad-btn dpad-up" ontouchstart="simulateKey('ArrowUp', 'keydown')" ontouchend="simulateKey('ArrowUp', 'keyup')">▲</div>
                    <div class="dpad-btn dpad-left" ontouchstart="simulateKey('ArrowLeft', 'keydown')" ontouchend="simulateKey('ArrowLeft', 'keyup')">◀</div>
                    <div class="dpad-btn dpad-right" ontouchstart="simulateKey('ArrowRight', 'keydown')" ontouchend="simulateKey('ArrowRight', 'keyup')">▶</div>
                    <div class="dpad-btn dpad-down" ontouchstart="simulateKey('ArrowDown', 'keydown')" ontouchend="simulateKey('ArrowDown', 'keyup')">▼</div>
                </div>
                <div class="action-pad">
                    <div class="action-btn" ontouchstart="simulateKey('Digit1', 'keydown')" ontouchend="simulateKey('Digit1', 'keyup')">1</div>
                    <div class="action-btn" ontouchstart="simulateKey('Digit2', 'keydown')" ontouchend="simulateKey('Digit2', 'keyup')">2</div>
                    <div class="action-btn" ontouchstart="simulateKey('Digit3', 'keydown')" ontouchend="simulateKey('Digit3', 'keyup')">3</div>
                    <div class="action-btn" ontouchstart="simulateKey('Digit4', 'keydown')" ontouchend="simulateKey('Digit4', 'keyup')">4</div>
                    <div class="action-btn" ontouchstart="simulateKey('Space', 'keydown')" ontouchend="simulateKey('Space', 'keyup')">SPC</div>
                    <div class="action-btn" ontouchstart="simulateKey('Enter', 'keydown')" ontouchend="simulateKey('Enter', 'keyup')">ENT</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        let ruffle, player;
        window.addEventListener("DOMContentLoaded", () => {
            ruffle = window.RufflePlayer.newest();
            loadFlash();
        });
        async function loadFlash() {
            let rawUrl = document.getElementById('swf-input').value;
            const container = document.getElementById('ruffle-stage');
            container.innerHTML = "";
            player = ruffle.createPlayer();
            container.appendChild(player);
            
            // Bypass CORS using corsproxy.io
            const targetUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);
            try {
                await player.load({ url: targetUrl, allowScriptAccess: true });
            } catch (e) {
                console.error(e);
            }
        }
        function simulateKey(code, type) {
            if (!player) return;
            player.dispatchEvent(new KeyboardEvent(type, { code: code, key: code.replace('Digit', ''), bubbles: true }));
        }
    </script>
</body>
</html>
